/* Mattemästaren v2 – sex val, tabellrace, repetition och tiokompisar */
.highscore-panel{margin:16px auto;padding:14px;border-radius:18px;background:#f7f3ff;text-align:left}
.highscore-panel h3{text-align:center;font-size:16px}
.highscore-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.highscore-list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:#fff;font-weight:850}
.highscore-list li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.highscore-list li strong{color:#5c37b6;font-size:14px}
.leader-medal{min-width:23px}

.record-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:15px 0 26px}
.record-tile{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;min-height:100px;padding:10px 5px;border:2px solid #e7def8;background:#fff;border-radius:18px;color:#34205d;box-shadow:0 4px 0 #e9e1f6;text-align:center}
.record-tile:active,.answer-option:active{transform:translateY(3px);box-shadow:none}
.record-tile .record-number{font-weight:1000;font-size:30px;color:#784bd3;line-height:1.05}
.record-tile strong{font-size:12px}.record-tile small{font-size:10px;color:#77689a;line-height:1.25}
.record-locked{opacity:.5;background:#f7f5fa}
.friends-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(110deg,#e9fff4,#f3ebff)}
.friends-banner .friends-symbol{font-size:32px}.friends-banner>div:nth-child(2){flex:1;min-width:150px}.friends-banner h3{margin:0 0 5px}.friends-banner p{font-size:12px;color:#675b80;margin:0 0 5px}.friends-banner small{font-weight:900;color:#6343b7}.friends-banner .btn{padding:11px 14px}
.warmup-screen{max-width:530px;margin:14px auto;background:#fff;border:1px solid #e8e0f8;border-radius:27px;padding:25px 21px 31px;text-align:center;box-shadow:0 7px 0 #e9e1f6}
.warmup-screen .warmup-mascot{font-size:65px;line-height:1.3;margin-bottom:15px}.warmup-mascot span{font-size:25px;color:#d8a32a}
.warmup-screen h1{color:#4b3099}.warmup-title{font-size:21px;font-weight:1000;color:#31225d;margin:11px 0}
.warmup-screen .muted{font-size:14px}.warmup-screen .wide{display:flex;width:100%;margin:12px auto;max-width:390px;min-height:54px}
.best-card{background:#fff6dc;border:2px solid #f3d188;padding:14px;border-radius:18px;font-size:15px;color:#67502b;margin:20px auto;font-weight:900}
.best-card strong{display:block;font-size:25px;color:#6240b7;margin-top:4px}
.review-stack{margin:18px auto 10px;display:grid;align-items:center;grid-template-rows:65px 132px 65px;gap:5px}
.review-neighbor{opacity:.28;font-weight:850;color:#5f4e8e;filter:blur(.4px)}
.review-center{border-radius:22px;background:linear-gradient(135deg,#f0eaff,#fff9de);border:2px solid #e6d8ff;display:flex;align-items:center;justify-content:center;padding:14px 7px;min-height:120px}
.review-factors{display:flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;font-size:clamp(19px,5vw,27px);font-weight:900}
.review-center .review-factors{font-size:clamp(22px,6vw,33px);gap:9px}
.review-center .review-factors b{font-size:clamp(35px,11vw,57px);color:#5b35bd;line-height:1}
.review-mult{font-size:.77em;color:#a48ebb}
.review-neighbor .review-factors b{font-size:25px}
.review-track{height:8px;border-radius:20px;background:#eee6fa;overflow:hidden;margin:12px 6px}
#review-progress{height:100%;width:10%;background:linear-gradient(90deg,#8e65e9,#ffbd51);transition:width .3s}
.review-step-label{font-size:12px;font-weight:900;color:#756593;margin-bottom:19px}
.choice-game .question-card{margin-bottom:12px;padding-bottom:12px}.choice-game .equation{margin:14px auto 9px;font-size:clamp(30px,8vw,49px)}
.choice-game .answer-status{height:0;min-height:0;padding:0;border:0;margin:0;overflow:hidden;font-size:0}
.choice-game .feedback{margin-top:8px;min-height:25px}
.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:600px;margin:12px auto 20px}
.answer-option{border:2px solid #dfd2f7;border-radius:20px;background:#fff;min-height:78px;display:flex;align-items:center;justify-content:center;gap:12px;color:#3c2979;box-shadow:0 5px 0 #dfd3f5;font-weight:1000;touch-action:manipulation}
.answer-option strong{font-size:clamp(26px,7vw,38px);line-height:1.1}.answer-option small{font-size:12px;color:#a08abc;align-self:flex-start;margin-top:11px}
.answer-option:nth-child(2n){background:#f6f0ff}.answer-option:disabled{opacity:.62;cursor:default}.answer-option.picked{background:#deffdd;border-color:#61b875;color:#245a30;opacity:1}
.answer-option.picked.miss{background:#ffe4e4;border-color:#d97082;color:#98253f}
.answer-option.revealed{background:#dfffee;border-color:#5bb87e;color:#275b41;opacity:1}
.result-record{text-align:center;max-width:550px}.result-record small{display:block;margin-top:8px}
@media(min-width:620px){.record-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:370px){.answer-option{min-height:69px}.answer-grid{gap:9px}.record-tile{min-height:95px}}

/* v2.1 – kompakt mobilvy, tydlig rättning och lätttryckta sifferknappar */
.topbar{height:58px}
main{padding:2px 11px 18px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.bottom-nav{height:calc(65px + env(safe-area-inset-bottom))}
.navitem{padding:6px 12px;gap:1px}

<body>
 <div id="app">

    </div>

 </div>
 <div id="modal-layer" class="modal-layer hidden" aria-live="polite"></div>
 <div id="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
'use strict';
const KEY='mattemastaren_v1';
const EMOJIS=['🦊','🐼','🦄','🐲','🐱','🐻','🐸','🦁'];
const CREATURES=[
 {id:'fox',emoji:'🦊',name:'Fnatte räv',need:0,description:'Din första äventyrsvän'},
 {id:'owl',emoji:'🦉',name:'Kloka ugglan',need:2,description:'Når nivå 2'},
 {id:'dragon',emoji:'🐉',name:'Gnistrande draken',need:4,description:'Når nivå 4'},
 {id:'unicorn',emoji:'🦄',name:'Stjärnenhörningen',need:6,description:'Når nivå 6'},
 {id:'griffin',emoji:'🦅',name:'Himmelväktaren',need:9,description:'Når nivå 9'},
 {id:'phoenix',emoji:'🔥',name:'Fenix',need:12,description:'Når nivå 12'},
 {id:'crown',emoji:'👑',name:'Mästarkronan',need:16,description:'Når nivå 16'},
 {id:'crystal',emoji:'💎',name:'Kristallhjärtat',need:20,description:'Når nivå 20'},
 {id:'rocket',emoji:'🚀',name:'Stjärnskeppet',need:24,description:'Når nivå 24'},
 {id:'rainbow',emoji:'🌈',name:'Regnbågsnyckeln',need:30,description:'Når nivå 30'}
];
const ACHIEVEMENTS=[
 {id:'first',emoji:'🌱',name:'Första steget',text:'Svara rätt på ditt första tal',test:p=>p.totalCorrect>=1},
 {id:'ten',emoji:'🎯',name:'Prickskytt',text:'10 rätta svar sammanlagt',test:p=>p.totalCorrect>=10},
 {id:'fifty',emoji:'🌟',name:'Stjärnsamlare',text:'50 rätta svar sammanlagt',test:p=>p.totalCorrect>=50},
 {id:'hundred',emoji:'🏅',name:'Hundraklubben',text:'100 rätta svar sammanlagt',test:p=>p.totalCorrect>=100},
 {id:'speed',emoji:'⚡',name:'Blixtsnabb',text:'Svara rätt på under 2 sekunder',test:p=>p.fastestMs>0&&p.fastestMs<2000},
 {id:'combo',emoji:'🔥',name:'Het svit',text:'5 rätt i rad',test:p=>p.bestCombo>=5},
 {id:'combo10',emoji:'🌋',name:'Ostoppbar',text:'10 rätt i rad',test:p=>p.bestCombo>=10},
 {id:'practice',emoji:'📚',name:'Träningshjälte',text:'Slutför 5 träningspass',test:p=>(p.sessions||0)>=5},
 {id:'boss',emoji:'🐲',name:'Drakbesegrare',text:'Vinn din första bosskamp',test:p=>(p.bossWins||0)>0},
 {id:'days',emoji:'📅',name:'Vän av vana',text:'Träna 3 olika dagar',test:p=>(p.daysPlayed||[]).length>=3},
 {id:'level',emoji:'🗝️',name:'Hemlig passage',text:'Lås upp 11:ans tabell',test:p=>level(p)>=5},
 {id:'master',emoji:'🧠',name:'Tabellmästare',text:'Behärska 20 olika tal',test:p=>masteredCount(p)>=20}
];
const WORLDS=[{at:1,emoji:'🌳',name:'Viskskogen',detail:'Ditt äventyr börjar här'},{at:3,emoji:'🏰',name:'Kristallslottet',detail:'Möt den vänliga slottsdraken'},{at:6,emoji:'🌊',name:'Pärlhavet',detail:'Räkna dig förbi vågorna'},{at:9,emoji:'🌋',name:'Eldberget',detail:'Bli snabbare än lavan'},{at:13,emoji:'☁️',name:'Molnriket',detail:'Upptäck talens hemligheter'},{at:18,emoji:'🌌',name:'Stjärnvärlden',detail:'Vägen mot mästarkronan'}];
let state=load(); let page='home'; let game=null; let choiceTable=0; let mute=false; let toastTimer=null; let advanceTimer=null; let ticker=null;
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newProfile(name,avatar){return {id:uid(),name,avatar,coins:0,xp:0,totalCorrect:0,totalAnswered:0,totalMs:0,fastestMs:0,combo:0,bestCombo:0,sessions:0,bossWins:0,sprintBest:0,daysPlayed:[],lastGift:'',lastPlayed:'',facts:{},achievements:[],created:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.profiles))return s}catch(e){}return {profiles:[],active:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Kunde inte spara. Kontrollera webbläsarens lagringsutrymme.');return false}}
function active(){return state.profiles.find(p=>p.id===state.active)||null}
function level(p){return Math.max(1,Math.floor(Math.sqrt((p.xp||0)/80))+1)}
function levelStart(l){return 80*(l-1)*(l-1)}
function levelEnd(l){return 80*l*l}
function maxTable(p){return level(p)>=8?12:level(p)>=5?11:10}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function factKey(a,b){return [Math.min(a,b),Math.max(a,b)].join('x')}
function masteredCount(p){return Object.values(p.facts||{}).filter(f=>f.mastery>=4&&f.lastMs<=4000).length}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2450)}
function ding(success){if(mute)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=ding.ctx||(ding.ctx=new C());if(ctx.state==='suspended')ctx.resume();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=success?650:250;gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);osc.start();osc.stop(ctx.currentTime+.14)}catch(e){}}
function headers(){const p=active();document.getElementById('coin-display').innerHTML='🪙 <b>'+((p&&p.coins)||0)+'</b>';document.getElementById('avatar-emoji').textContent=p?.avatar||'✨';document.getElementById('avatar-name').textContent=p?.name||'Ny spelare';document.querySelectorAll('[data-nav]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.nav===page);btn.disabled=!!game})}
function setPage(next){if(game){if(next==='home')confirmExit();return;}page=next;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){clearInterval(ticker);ticker=null;headers();let p=active();if(!p){renderWelcome();return}const main=document.getElementById('main');main.innerHTML=page==='home'?home(p):page==='adventure'?adventure(p):page==='collection'?collection(p):page==='progress'?progress(p):home(p);bindPage()}
function renderWelcome(){document.getElementById('main').innerHTML=`<section class="hero" style="min-height:330px"><div class="hero-copy" style="max-width:75%"><div class="hero-tag">VÄLKOMMEN TILL ÄVENTYRET</div><h1>Hej, mattestjärna! ✨</h1><p>Lär dig tabellerna, samla magiska vänner och bli blixtsnabb!</p><button class="btn btn-gold" id="new-player-main">Börja spela →</button></div><div class="hero-art">🦊</div></section><div class="card"><h2>Din egen mattevärld</h2><p class="muted">Du kan träna i lugn takt eller tävla mot klockan. Alla dina framsteg sparas på den här enheten.</p><p class="muted small">Inget konto behövs. Inga annonser. Inga köp.</p></div>`;document.getElementById('new-player-main').onclick=()=>showProfiles(true)}
function pct(v,max){return Math.max(0,Math.min(100,Math.round(v/max*100)))}
function xpProgress(p){const l=level(p);return pct(p.xp-levelStart(l),levelEnd(l)-levelStart(l))}
function home(p){const l=level(p),avail=maxTable(p);return `<section class="hero"><div class="hero-copy"><div class="hero-tag">✦ NIVÅ ${l} • ${escapeHtml(p.name.toUpperCase())}</div><h1>Redo för ett nytt äventyr?</h1><p>Varje rätt svar gör din magi starkare!</p><button class="btn btn-gold" id="start-practice">▶ Spela nu</button></div><div class="hero-art">${l>=6?'🐉':'🦊'}</div></section><div class="stats-row"><div class="stat"><span class="symbol">⚡</span><strong>${p.bestCombo}</strong><small>Bästa svit</small></div><div class="stat"><span class="symbol">🎯</span><strong>${p.totalCorrect}</strong><small>Rätta svar</small></div><div class="stat"><span class="symbol">🏆</span><strong>${masteredCount(p)}</strong><small>Bemästrade tal</small></div></div>${p.lastGift!==today()?`<section class="card reward-banner"><span class="gift">🎁</span><div><strong>Din dagliga skatt!</strong><p>Öppna kistan och få 20 stjärnmynt.</p></div><button class="btn btn-gold" id="claim-gift">Öppna</button></section>`:''}<section class="section-head"><h2>Välj ditt uppdrag</h2></section><div class="mode-grid"><button class="mode-card practice" data-mode="practice"><span class="mode-art">🌱</span><strong>Träna smart</strong><small>10 tal i din egen takt. Lär dig bättre för varje dag.</small></button><button class="mode-card sprint" data-mode="sprint"><span class="mode-art">⚡</span><strong>Blixtjakten</strong><small>45 sekunder! Hur många rätt hinner du?</small></button><button class="mode-card boss" data-mode="boss"><span class="mode-art">🐲</span><strong>Bosskamp</strong><small>12 tal. Minst 10 rätt för att besegra draken!</small></button><button class="mode-card tables" id="choose-table"><span class="mode-art">🔢</span><strong>Välj tabell</strong><small>Öva en särskild tabell, från 1 till ${avail}.</small></button></div><section class="section-head"><h2>Din magiska styrka</h2><span class="badge-pill">Nivå ${l}</span></section><div class="card level-card"><div class="level-emblem">🌟</div><div class="level-copy"><h3>${p.xp} XP totalt</h3><p>${levelEnd(l)-p.xp} XP kvar till nivå ${l+1}</p><div class="progress-track"><div class="progress-fill" style="width:${xpProgress(p)}%"></div></div></div></div><p class="cheer">🌈 Kort träning ofta är bättre än en jättelång omgång!</p>`}
function adventure(p){const l=level(p);return `<div class="page-head"><p class="eyebrow">DET STORA ÄVENTYRET</p><h1>Utforska mattevärlden 🗺️</h1><p class="muted">Samla erfarenhetspoäng genom träning och lås upp nya platser. Alla tal du lär dig tar dig närmare nästa värld.</p></div><div class="card"><div class="section-head"><h3>Din resa mot nivå ${l+1}</h3><strong>${xpProgress(p)} %</strong></div><div class="progress-track"><div class="progress-fill" style="width:${xpProgress(p)}%"></div></div></div><div class="map-trail">${WORLDS.map(w=>`<div class="world ${l>=w.at?'unlocked':''}"><span class="world-art">${l>=w.at?w.emoji:'🔒'}</span><div class="world-copy"><h3>${escapeHtml(w.name)}</h3><small>${escapeHtml(w.detail)}</small></div><span class="badge-pill">${l>=w.at?'Upplåst ✓':'Nivå '+w.at}</span></div>`).join('')}</div><div class="card section-spacer"><h3>🎲 Extra utmaningar</h3><p class="muted small">11:ans tabell låses upp på nivå 5 och 12:ans på nivå 8. Ditt äventyr fortsätter efter det!</p><button class="btn btn-purple" data-mode="boss">🐲 Utmana draken</button></div>`}
function collection(p){const l=level(p);return `<div class="page-head"><p class="eyebrow">SKATTKAMMAREN</p><h1>Dina magiska vänner 🎒</h1><p class="muted">Ju mer du lär dig, desto fler vänner och skatter dyker upp!</p></div><div class="stats-row"><div class="stat"><span class="symbol">🪙</span><strong>${p.coins}</strong><small>Stjärnmynt</small></div><div class="stat"><span class="symbol">🧸</span><strong>${CREATURES.filter(c=>l>=c.need).length}/${CREATURES.length}</strong><small>Skatter</small></div><div class="stat"><span class="symbol">🏅</span><strong>${p.achievements.length}/${ACHIEVEMENTS.length}</strong><small>Medaljer</small></div></div><h2>Magiska samlingen</h2><div class="collection-grid">${CREATURES.map(c=>`<div class="collectible ${l<c.need?'unknown':''}"><span class="item-art">${l>=c.need?c.emoji:'❔'}</span><strong>${l>=c.need?escapeHtml(c.name):'Hemlig skatt'}</strong><small>${l>=c.need?escapeHtml(c.description):'Nivå '+c.need}</small></div>`).join('')}</div><h2 class="section-spacer">Dina medaljer</h2><div class="stack">${ACHIEVEMENTS.map(a=>`<div class="achievement ${p.achievements.includes(a.id)?'':'locked'}"><span class="medal">${p.achievements.includes(a.id)?a.emoji:'🔒'}</span><div><strong>${escapeHtml(a.name)}</strong><small>${escapeHtml(a.text)}</small></div><span>${p.achievements.includes(a.id)?'✅':''}</span></div>`).join('')}</div>`}
function progress(p){const l=level(p);const entries=Object.values(p.facts||{});const attempts=entries.reduce((a,f)=>a+(f.attempts||0),0);const accuracy=p.totalAnswered?Math.round(p.totalCorrect/p.totalAnswered*100):0;const avg=p.totalCorrect?((p.totalMs/p.totalCorrect)/1000).toFixed(1):'–';return `<div class="page-head"><p class="eyebrow">MINA FRAMSTEG</p><h1>Vilken mattehjälte! 📈</h1><p class="muted">Här ser du vilka tal du redan kan snabbt och vilka som behöver lite mer övning.</p></div><div class="stats-row"><div class="stat"><span class="symbol">🌟</span><strong>${l}</strong><small>Nivå</small></div><div class="stat"><span class="symbol">🎯</span><strong>${accuracy}%</strong><small>Rätt svar</small></div><div class="stat"><span class="symbol">⏱️</span><strong>${avg}${avg==='–'?'':' s'}</strong><small>Medeltid rätt</small></div></div><div class="card"><h3>Vad betyder bemästrat?</h3><p class="muted small" style="margin-bottom:0">Ett tal räknas som bemästrat när du har svarat rätt flera gånger och senast på högst 4 sekunder. Att svara rätt är viktigare än att chansa fort!</p></div><h2>Tabellkartan</h2><div class="card">${Array.from({length:maxTable(p)},(_,i)=>i+1).map(t=>{const keys=new Set(Array.from({length:10},(_,j)=>factKey(t,j+1)));const mastered=[...keys].filter(k=>p.facts?.[k]?.mastery>=4&&p.facts[k].lastMs<=4000).length;return `<div class="bar-line"><span>${t}:an</span><div class="progress-track"><div class="progress-fill" style="width:${mastered*10}%"></div></div><span>${mastered}/10</span></div>`}).join('')}</div><div class="card"><h3>Din mattehistoria</h3><p class="muted small">${p.sessions} spelomgångar · ${(p.daysPlayed||[]).length} träningsdagar · ${attempts} besvarade unika talregistreringar · ${p.bossWins} bossar besegrade</p><p class="muted small">Bästa Blixtjakten: <strong>${p.sprintBest} rätt på 45 sekunder</strong></p><div class="inline-buttons"><button class="btn btn-soft" id="export-profile">⬇️ Spara backup</button><button class="btn btn-outline" id="open-profile-manager">⚙️ Profiler</button></div></div>`}
function bindPage(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));document.getElementById('start-practice')?.addEventListener('click',()=>startGame('practice'));document.getElementById('choose-table')?.addEventListener('click',openTablePicker);document.getElementById('claim-gift')?.addEventListener('click',claimGift);document.getElementById('export-profile')?.addEventListener('click',exportData);document.getElementById('open-profile-manager')?.addEventListener('click',()=>showProfiles())}
function claimGift(){const p=active();if(!p||p.lastGift===today())return;p.lastGift=today();p.coins+=20;save();render();toast('🎁 +20 stjärnmynt! Kom tillbaka en annan dag!');ding(true)}
function checkAchievements(p){const newOnes=[];for(const a of ACHIEVEMENTS){if(!p.achievements.includes(a.id)&&a.test(p)){p.achievements.push(a.id);p.coins+=15;newOnes.push(a)}}return newOnes}
function allQuestions(p,table=0){const max=table||maxTable(p);const arr=[];for(let a=1;a<=max;a++){for(let b=1;b<=10;b++){if(table&&a!==table&&b!==table)continue; if(table&&a!==table&&b===table)continue;arr.push({a,b,key:factKey(a,b)})}}return arr}
function nextQuestion(){const p=active();const table=game.table||0;const qs=allQuestions(p,table);const now=Date.now();let pool=qs.filter(q=>q.key!==game.previousKey);if(!pool.length)pool=qs;const weights=pool.map(q=>{const f=p.facts[q.key];if(!f)return 7;const mastery=Math.max(0,f.mastery||0);const delay=Math.max(0,now-(f.lastSeen||0));const due=delay>24*3600000?2.5:delay>3600000?1.5:1;let weight=(1+Math.max(0,5-mastery)*1.45)*(f.lastCorrect===false?1.9:1)*due; if(game.recentKeys.includes(q.key))weight*=.15;return weight});const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total,ix=0;for(;ix<weights.length-1;ix++){r-=weights[ix];if(r<=0)break}let q=pool[ix];game.previousKey=q.key;game.recentKeys.push(q.key);if(game.recentKeys.length>4)game.recentKeys.shift();return q}

    });

  function showTableReady(n){
    if(!active()||n<1||n>maxTable(active()))return;
    stopReview();reviewTable=n;page='ready';headers();
    document.getElementById('main').innerHTML=`<section class="warmup-screen">
      <div class="warmup-mascot">${escapeHtml(active().avatar)} <span>✦</span></div>
      <p class="eyebrow">TABELLRACET</p><h1>${n}:ans tabell</h1>
      <p class="warmup-title">Är du redo?</p>
      <p class="muted">10 frågor • 6 svarsalternativ • tiden mäts när du svarar. Alla rätt ger ett tidsrekord.</p>
      <div class="best-card">🏆 Personbästa: <strong>${fmtTime(recordFor(active(),n))}</strong></div>
      <div class="highscore-panel"><h3>🏆 Hiscore – ${n}:ans tabell</h3>${scoreboardFor(n)}</div>
      <button class="btn btn-gold wide" id="ready-start">🚀 Start!</button>
      <button class="btn btn-soft wide" id="ready-repeat">👀 Repetera först</button>
      <button class="btn btn-outline wide" id="ready-change">Välj annan tabell</button>
    </section>`;
    document.getElementById('ready-start').onclick=()=>beginRound('table',n);
    document.getElementById('ready-repeat').onclick=()=>showReview(n);
    document.getElementById('ready-change').onclick=openTablePicker;
    scrollTo({top:0,behavior:'instant'});
  }
  function showFriendsReady(){
    stopReview();page='ready';headers();
    const p=active();
    document.getElementById('main').innerHTML=`<section class="warmup-screen">
      <div class="warmup-mascot">🐰 🤝</div><p class="eyebrow">KOMPISUTMANING</p><h1>Tiokompisar</h1>
      <p class="warmup-title">Kan du hitta talet som fattas?</p>
      <div class="review-center"><span class="review-factors"><b>4</b> + <b>?</b> = <b>10</b></span></div>
      <p class="muted">11 frågor med talen 0–10. Välj rätt av sex alternativ så snabbt du kan. Alla rätt krävs för rekord.</p>
      <div class="best-card">🏆 Personbästa: <strong>${fmtTime(p.friendsBestMs)}</strong></div>
      <div class="highscore-panel"><h3>🏆 Hiscore – Tiokompisar</h3>${scoreboardFor("friends")}</div>
      <button class="btn btn-gold wide" id="friends-ready-start">⚡ Start!</button>
      <button class="btn btn-outline wide" id="friends-back">Till startsidan</button>
    </section>`;
    document.getElementById('friends-ready-start').onclick=()=>beginRound('friends',0);
    document.getElementById('friends-back').onclick=()=>setPage('home');
    scrollTo({top:0,behavior:'instant'});
  }
  function showReview(n){
    stopReview();reviewTable=n;reviewStep=1;page='review';headers();
    const main=document.getElementById('main');
    main.innerHTML=`<section class="warmup-screen review-screen">
      <p class="eyebrow">TITTA OCH MINNS</p><h1>Repetera ${n}:ans tabell</h1>
      <p class="muted">Ett tal i taget, 1,5 sekunder per tal.</p>
      <div class="review-stack"><div id="review-prev" class="review-neighbor"></div>
       <div id="review-current" class="review-center" aria-live="off"></div>
       <div id="review-next" class="review-neighbor"></div></div>
      <div class="review-track"><div id="review-progress"></div></div>
      <div class="review-step-label" id="review-count">1 av 10</div>
      <button class="btn btn-gold wide" id="review-start">🚀 Jag är redo – Start!</button>
      <button class="btn btn-outline wide" id="review-cancel">Tillbaka</button>
    </section>`;
    document.getElementById('review-start').onclick=()=>{stopReview();beginRound('table',n)};
    document.getElementById('review-cancel').onclick=()=>showTableReady(n);
    const line=(a,main=false)=>`<span class="review-factors"><b>${a}</b><span>×</span><span class="review-mult">${n}</span><span>=</span><b>${a*n}</b></span>`;
    function paint(){
      const i=reviewStep;
      document.getElementById('review-prev').innerHTML=i>1?line(i-1):'&nbsp;';
      document.getElementById('review-current').innerHTML=line(i,true);
      document.getElementById('review-next').innerHTML=i<10?line(i+1):'&nbsp;';
      document.getElementById('review-count').textContent=i+' av 10';
      document.getElementById('review-progress').style.width=(i*10)+'%';
    }
    paint();
    reviewTimer=setInterval(()=>{
      if(reviewStep>=10){stopReview();showTableReady(n);toast('🌟 Nu är du redo!');return}
      reviewStep++;paint();
    },1500);
    scrollTo({top:0,behavior:'instant'});
  }
  // Fast tabellordning är lätt att jämföra. Tiokompisar blandas för att undvika inlärda knapprörelser.
  nextQuestion=function(){
    if(game?.mode==='table'){
      const i=Math.min(10,game.answered+1);
      return {a:i,b:game.table,key:factKey(i,game.table)};
    }
    if(game?.mode==='friends'){
      if(!game.tenOrder){
        const order=Array.from({length:11},(_,i)=>i);
        for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
        game.tenOrder=order;
      }
      const n=game.tenOrder[Math.min(game.answered,10)];
      return {a:1,b:10-n,key:'ten-'+n,ten:n};
    }
    return originalNextQuestion();
  };
  function beginRound(mode,table=0){
    stopReview();
    originalStartGame(mode,table);
    if(!game)return;
    if(mode==='friends'){game.limit=11;updateQuestion()}
    if(mode==='table'||mode==='friends'){
      ticker=setInterval(()=>{
        if(!game||game.isFinished||!['table','friends'].includes(game.mode))return;
        const e=document.getElementById('live-stopwatch');
        if(e)e.textContent=fmtTime(game.elapsedTotal+(game.locked?0:Math.max(0,Date.now()-game.startedAt)));
      },90);
    }
    scrollTo({top:0,behavior:'instant'});
  }
  startGame=function(mode,table=0){
    if(mode==='table')return showTableReady(table);
    if(mode==='friends')return showFriendsReady();
    return beginRound(mode,table);
  };
  // Sex stora svarsknappar. Distraktorer är unika och kopplade till den aktuella frågan.
  function answerOptions(q){
    const truth=q.a*q.b,choice=new Set([truth]);
    if(game.mode==='friends'){
      const vals=Array.from({length:11},(_,i)=>i).filter(v=>v!==truth);
      for(let i=vals.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
      vals.slice(0,5).forEach(v=>choice.add(v));
    }else{
      const increments=game.mode==='table'?[q.b,-q.b,q.b*2,-q.b*2,1,-1,2,-2,3,-3,5,-5,10,-10]:[q.a,-q.a,q.b,-q.b,1,-1,2,-2,3,-3,10,-10];
      for(const delta of increments){const v=truth+delta;if(v>=0&&v<=144)choice.add(v);if(choice.size===6)break}
      const nearby=Array.from({length:145},(_,i)=>i).filter(v=>!choice.has(v));
      nearby.sort((a,b)=>Math.abs(a-truth)-Math.abs(b-truth));
      for(const v of nearby){choice.add(v);if(choice.size===6)break}
    }
    const arr=[...choice].slice(0,6);
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
    return arr;
  }
  showGame=function(){
    const g=game;headers();
    document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));
    const titles={practice:'SMART TRÄNING',sprint:'BLIXTJAKTEN',boss:'DRAKKAMP',table:`${g.table}:ANS TABELL`,friends:'TIOKOMPISAR'};
    const timed=['table','friends'].includes(g.mode);
    document.getElementById('main').innerHTML=`<section class="game-shell choice-game">
      <div class="game-header">
        <button class="icon-button" id="exit-game">✕ Avsluta</button>
        <span class="game-tag">${titles[g.mode]||'MATTE'}</span>
        <span class="game-counter" id="counter">1 / ${g.limit}</span>
      </div>
      <div class="game-bar progress-track"><div class="progress-fill" id="game-progress" style="width:0%"></div></div>
      <div class="game-meta"><span>🔥 <span id="game-combo">0</span> i rad</span>
       <span>${g.mode==='sprint'?'⏱️ <span id="time-left">45 s</span>':timed?'⏱️ <span id="live-stopwatch">0,00 s</span>':'🌟 +<span id="game-xp">0</span> XP'}</span></div>
      <div class="question-card" id="question-card">
        <span class="question-creature">${escapeHtml(active().avatar)}</span>
        <span class="question-title">${g.mode==='friends'?'Vilket tal fattas?':'Vad blir det?'}</span>
        <div class="equation" id="equation" aria-live="polite"></div>
        <div id="answer-box" class="answer-box answer-status" aria-live="polite"></div>
        <div class="feedback" id="feedback" aria-live="polite">Välj ett av sex svar ✨</div>
      </div>
      <div class="answer-grid" id="answer-options" aria-label="Sex svarsalternativ"></div>
      <p class="cheer">${timed?'🏆 Alla rätt krävs för personbästa. En felgissning stoppar rekordet.':'🌈 Rätt svar är viktigare än att chansa snabbt!'}</p>
    </section>`;
    document.getElementById('exit-game').onclick=confirmExit;
    updateQuestion();
  };
  updateQuestion=function(){
    originalUpdateQuestion();
    if(!game||game.isFinished)return;
    const g=game,q=g.question;
    document.getElementById('equation').textContent=g.mode==='friends'?`${q.ten} + ? = 10`:`${q.a} × ${q.b} = ?`;
    document.getElementById('answer-box').textContent='';
    document.getElementById('answer-box').classList.add('answer-status');
    document.getElementById('feedback').textContent='Välj rätt svar! ✨';
    const opts=answerOptions(q);
    document.getElementById('answer-options').innerHTML=opts.map((v,i)=>`<button class="answer-option" data-answer="${v}" aria-label="Svar ${v}"><strong>${v}</strong></button>`).join('');
    document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>pickAnswer(Number(btn.dataset.answer)));
  };
  function pickAnswer(value){
    if(!game||game.locked||game.isFinished)return;
    if(game.mode==='sprint'&&Date.now()>=game.deadline){finishGame();return}
    document.querySelectorAll('[data-answer]').forEach(btn=>{btn.disabled=true;const ans=Number(btn.dataset.answer);if(ans===value)btn.classList.add('picked',ans===game.question.a*game.question.b?'hit':'miss');else if(ans===game.question.a*game.question.b)btn.classList.add('revealed');});
    const correctAnswer=game.question.a*game.question.b;
    game.input=String(value);
    originalSubmitAnswer();
    if(value!==correctAnswer){
      const fb=document.getElementById('feedback');
      if(fb){
        fb.className='feedback correction-feedback';
        fb.innerHTML='<span class="wrong-response">Du valde <del>'+value+'</del></span><span class="correct-response">Rätt: <strong>'+correctAnswer+'</strong></span>';
      }
    }
  }
  handleDigit=function(d){
    if(!game||game.locked||game.isFinished)return;
    const i=Number(d);if(!Number.isInteger(i)||i<1||i>6)return;
    const btn=document.querySelectorAll('[data-answer]')[i-1];
    if(btn)pickAnswer(Number(btn.dataset.answer));
  };
  submitAnswer=function(){/* Inga skrivna svar – sex tydliga val används. */};
  finishGame=function(){
    if(!game||game.isFinished)return;
    const g=game,p=active(),isTimeTrial=['table','friends'].includes(g.mode),
      completed=g.answered===g.limit,perfect=completed&&g.correct===g.limit,
      elapsed=g.elapsedTotal;
    let oldRecord=null,newRecord=false;
    if(isTimeTrial&&perfect){
      if(g.mode==='table'){
        p.tableRecords=p.tableRecords||{};
        oldRecord=p.tableRecords[g.table]??null;
        if(oldRecord===null||elapsed<oldRecord){
          p.tableRecords[g.table]=elapsed;newRecord=true;
        }
      }else{
        oldRecord=p.friendsBestMs??null;
        if(oldRecord===null||elapsed<oldRecord){p.friendsBestMs=elapsed;newRecord=true}
      }
      if(newRecord){g.xp+=40;g.coins+=12}
    }else if(isTimeTrial)oldRecord=g.mode==='table'?recordFor(p,g.table):(p.friendsBestMs??null);
    originalFinishGame();
    if(isTimeTrial){
      const stats=document.querySelector('.result-stats');
      if(stats){
        stats.insertAdjacentHTML('afterend',`<div class="best-card result-record">
          <div>${g.mode==='table'?`${g.table}:ans tabell`:'Tiokompisar'} – ${completed?'Din svarstid':'Avbruten omgång'}</div>
          <strong>${fmtTime(elapsed)}</strong>
          <div>${newRecord?'🎉 NYTT PERSONBÄSTA! +40 XP och +12 mynt':perfect?'✅ Alla rätt! Rekord: '+fmtTime(oldRecord):completed?'🌱 För rekord behöver du alla rätt – prova igen!':'💪 Du kan göra ett nytt försök när du vill.'}</div>
          <small>🏆 Bästa felfria tid: ${fmtTime(g.mode==='table'?recordFor(p,g.table):p.friendsBestMs)}</small>
        </div>`);
      }
    }
  };
  // Kaninen går att välja både vid ny profil och för redan skapade barn.
  function changeFriend(){
    const p=active();if(!p)return;
    showModal(`<div class="modal-heading"><h2>Välj din magiska vän 🐰</h2><button class="close-modal" data-close>×</button></div>
      <p class="muted small">Du får byta när du vill. Alla dina resultat sparas.</p>
      <div class="avatar-choices">${EMOJIS.map(e=>`<button class="avatar-choice ${p.avatar===e?'selected':''}" data-friend-emoji="${e}" aria-label="Välj ${e}">${e}</button>`).join('')}</div>`);
    document.querySelectorAll('[data-friend-emoji]').forEach(btn=>btn.onclick=()=>{
      p.avatar=btn.dataset.friendEmoji;save();closeModal();page='home';render();toast('Ny vän vald! '+p.avatar);
    });
  }
  showProfiles=function(creating=false){
    originalShowProfiles(creating);
    if(!creating&&active()){
      const b=document.getElementById('new-profile');
      if(b){b.insertAdjacentHTML('afterend','<button class="btn btn-soft" id="change-friend" style="margin:10px 0">🐰 Byt magisk vän</button>');
        document.getElementById('change-friend').onclick=changeFriend;}
    }
  };
})();
render();
})();

  </script>
