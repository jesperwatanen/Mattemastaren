  <script>
(() => {
'use strict';
const KEY='mattemastaren_v1';
const EMOJIS=['🦊','🐼','🦄','🐲','🐱','🐻','🐸','🦁'];
const CREATURES=[
 {id:'fox',emoji:'🦊',name:'Fnatte räv',need:0,description:'Din första äventyrsvän'},
 {id:'owl',emoji:'🦉',name:'Kloka ugglan',need:2,description:'Når nivå 2'},
 {id:'dragon',emoji:'🐉',name:'Gnistrande draken',need:4,description:'Når nivå 4'},
 {id:'unicorn',emoji:'🦄',name:'Stjärnenhörningen',need:6,description:'Når nivå 6'},
 {id:'griffin',emoji:'🦅',name:'Himmelväktaren',need:9,description:'Når nivå 9'},
 {id:'phoenix',emoji:'🔥',name:'Fenix',need:12,description:'Når nivå 12'},
 {id:'crown',emoji:'👑',name:'Mästarkronan',need:16,description:'Når nivå 16'},
 {id:'crystal',emoji:'💎',name:'Kristallhjärtat',need:20,description:'Når nivå 20'},

];
const ACHIEVEMENTS=[
 {id:'first',emoji:'🌱',name:'Första steget',text:'Svara rätt på ditt första tal',test:p=>p.totalCorrect>=1},
 {id:'ten',emoji:'🎯',name:'Prickskytt',text:'10 rätta svar sammanlagt',test:p=>p.totalCorrect>=10},
 {id:'fifty',emoji:'🌟',name:'Stjärnsamlare',text:'50 rätta svar sammanlagt',test:p=>p.totalCorrect>=50},
 {id:'hundred',emoji:'🏅',name:'Hundraklubben',text:'100 rätta svar sammanlagt',test:p=>p.totalCorrect>=100},
 {id:'speed',emoji:'⚡',name:'Blixtsnabb',text:'Svara rätt på under 2 sekunder',test:p=>p.fastestMs>0&&p.fastestMs<2000},
 {id:'combo',emoji:'🔥',name:'Het svit',text:'5 rätt i rad',test:p=>p.bestCombo>=5},
 {id:'combo10',emoji:'🌋',name:'Ostoppbar',text:'10 rätt i rad',test:p=>p.bestCombo>=10},
 {id:'practice',emoji:'📚',name:'Träningshjälte',text:'Slutför 5 träningspass',test:p=>(p.sessions||0)>=5},
 {id:'boss',emoji:'🐲',name:'Drakbesegrare',text:'Vinn din första bosskamp',test:p=>(p.bossWins||0)>0},
 {id:'days',emoji:'📅',name:'Vän av vana',text:'Träna 3 olika dagar',test:p=>(p.daysPlayed||[]).length>=3},
 {id:'level',emoji:'🗝️',name:'Hemlig passage',text:'Lås upp 11:ans tabell',test:p=>level(p)>=5},
 {id:'master',emoji:'🧠',name:'Tabellmästare',text:'Behärska 20 olika tal',test:p=>masteredCount(p)>=20}
];
const WORLDS=[{at:1,emoji:'🌳',name:'Viskskogen',detail:'Ditt äventyr börjar här'},{at:3,emoji:'🏰',name:'Kristallslottet',detail:'Möt den vänliga slottsdraken'},{at:6,emoji:'🌊',name:'Pärlhavet',detail:'Räkna dig förbi vågorna'},{at:9,emoji:'🌋',name:'Eldberget',detail:'Bli snabbare än lavan'},{at:13,emoji:'☁️',name:'Molnriket',detail:'Upptäck talens hemligheter'},{at:18,emoji:'🌌',name:'Stjärnvärlden',detail:'Vägen mot mästarkronan'}];
let state=load(); let page='home'; let game=null; let choiceTable=0; let mute=false; let toastTimer=null; let advanceTimer=null; let ticker=null;
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newProfile(name,avatar){return {id:uid(),name,avatar,coins:0,xp:0,totalCorrect:0,totalAnswered:0,totalMs:0,fastestMs:0,combo:0,bestCombo:0,sessions:0,bossWins:0,sprintBest:0,daysPlayed:[],lastGift:'',lastPlayed:'',facts:{},achievements:[],created:Date.now()}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.profiles))return s}catch(e){}return {profiles:[],active:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Kunde inte spara. Kontrollera webbläsarens lagringsutrymme.');return false}}
function active(){return state.profiles.find(p=>p.id===state.active)||null}
function level(p){return Math.max(1,Math.floor(Math.sqrt((p.xp||0)/80))+1)}
function levelStart(l){return 80*(l-1)*(l-1)}
function levelEnd(l){return 80*l*l}
function maxTable(p){return level(p)>=8?12:level(p)>=5?11:10}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function factKey(a,b){return [Math.min(a,b),Math.max(a,b)].join('x')}
function masteredCount(p){return Object.values(p.facts||{}).filter(f=>f.mastery>=4&&f.lastMs<=4000).length}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2450)}
function ding(success){if(mute)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=ding.ctx||(ding.ctx=new C());if(ctx.state==='suspended')ctx.resume();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=success?650:250;gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);osc.start();osc.stop(ctx.currentTime+.14)}catch(e){}}
function headers(){const p=active();document.getElementById('coin-display').innerHTML='🪙 <b>'+((p&&p.coins)||0)+'</b>';document.getElementById('avatar-emoji').textContent=p?.avatar||'✨';document.getElementById('avatar-name').textContent=p?.name||'Ny spelare';document.querySelectorAll('[data-nav]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.nav===page);btn.disabled=!!game})}
function setPage(next){if(game){if(next==='home')confirmExit();return;}page=next;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){clearInterval(ticker);ticker=null;headers();let p=active();if(!p){renderWelcome();return}const main=document.getElementById('main');main.innerHTML=page==='home'?home(p):page==='adventure'?adventure(p):page==='collection'?collection(p):page==='progress'?progress(p):home(p);bindPage()}
function renderWelcome(){document.getElementById('main').innerHTML=`<section class="hero" style="min-height:330px"><div class="hero-copy" style="max-width:75%"><div class="hero-tag">VÄLKOMMEN TILL ÄVENTYRET</div><h1>Hej, mattestjärna! ✨</h1><p>Lär dig tabellerna, samla magiska vänner och bli blixtsnabb!</p><button class="btn btn-gold" id="new-player-main">Börja spela →</button></div><div class="hero-art">🦊</div></section><div class="card"><h2>Din egen mattevärld</h2><p class="muted">Du kan träna i lugn takt eller tävla mot klockan. Alla dina framsteg sparas på den här enheten.</p><p class="muted small">Inget konto behövs. Inga annonser. Inga köp.</p></div>`;document.getElementById('new-player-main').onclick=()=>showProfiles(true)}
function pct(v,max){return Math.max(0,Math.min(100,Math.round(v/max*100)))}
function xpProgress(p){const l=level(p);return pct(p.xp-levelStart(l),levelEnd(l)-levelStart(l))}
function home(p){const l=level(p),avail=maxTable(p);return `<section class="hero"><div class="hero-copy"><div class="hero-tag">✦ NIVÅ ${l} • ${escapeHtml(p.name.toUpperCase())}</div><h1>Redo för ett nytt äventyr?</h1><p>Varje rätt svar gör din magi starkare!</p><button class="btn btn-gold" id="start-practice">▶ Spela nu</button></div><div class="hero-art">${l>=6?'🐉':'🦊'}</div></section><div class="stats-row"><div class="stat"><span class="symbol">⚡</span><strong>${p.bestCombo}</strong><small>Bästa svit</small></div><div class="stat"><span class="symbol">🎯</span><strong>${p.totalCorrect}</strong><small>Rätta svar</small></div><div class="stat"><span class="symbol">🏆</span><strong>${masteredCount(p)}</strong><small>Bemästrade tal</small></div></div>${p.lastGift!==today()?`<section class="card reward-banner"><span class="gift">🎁</span><div><strong>Din dagliga skatt!</strong><p>Öppna kistan och få 20 stjärnmynt.</p></div><button class="btn btn-gold" id="claim-gift">Öppna</button></section>`:''}<section class="section-head"><h2>Välj ditt uppdrag</h2></section><div class="mode-grid"><button class="mode-card practice" data-mode="practice"><span class="mode-art">🌱</span><strong>Träna smart</strong><small>10 tal i din egen takt. Lär dig bättre för varje dag.</small></button><button class="mode-card sprint" data-mode="sprint"><span class="mode-art">⚡</span><strong>Blixtjakten</strong><small>45 sekunder! Hur många rätt hinner du?</small></button><button class="mode-card boss" data-mode="boss"><span class="mode-art">🐲</span><strong>Bosskamp</strong><small>12 tal. Minst 10 rätt för att besegra draken!</small></button><button class="mode-card tables" id="choose-table"><span class="mode-art">🔢</span><strong>Välj tabell</strong><small>Öva en särskild tabell, från 1 till ${avail}.</small></button></div><section class="section-head"><h2>Din magiska styrka</h2><span class="badge-pill">Nivå ${l}</span></section><div class="card level-card"><div class="level-emblem">🌟</div><div class="level-copy"><h3>${p.xp} XP totalt</h3><p>${levelEnd(l)-p.xp} XP kvar till nivå ${l+1}</p><div class="progress-track"><div class="progress-fill" style="width:${xpProgress(p)}%"></div></div></div></div><p class="cheer">🌈 Kort träning ofta är bättre än en jättelång omgång!</p>`}
function adventure(p){const l=level(p);return `<div class="page-head"><p class="eyebrow">DET STORA ÄVENTYRET</p><h1>Utforska mattevärlden 🗺️</h1><p class="muted">Samla erfarenhetspoäng genom träning och lås upp nya platser. Alla tal du lär dig tar dig närmare nästa värld.</p></div><div class="card"><div class="section-head"><h3>Din resa mot nivå ${l+1}</h3><strong>${xpProgress(p)} %</strong></div><div class="progress-track"><div class="progress-fill" style="width:${xpProgress(p)}%"></div></div></div><div class="map-trail">${WORLDS.map(w=>`<div class="world ${l>=w.at?'unlocked':''}"><span class="world-art">${l>=w.at?w.emoji:'🔒'}</span><div class="world-copy"><h3>${escapeHtml(w.name)}</h3><small>${escapeHtml(w.detail)}</small></div><span class="badge-pill">${l>=w.at?'Upplåst ✓':'Nivå '+w.at}</span></div>`).join('')}</div><div class="card section-spacer"><h3>🎲 Extra utmaningar</h3><p class="muted small">11:ans tabell låses upp på nivå 5 och 12:ans på nivå 8. Ditt äventyr fortsätter efter det!</p><button class="btn btn-purple" data-mode="boss">🐲 Utmana draken</button></div>`}
function collection(p){const l=level(p);return `<div class="page-head"><p class="eyebrow">SKATTKAMMAREN</p><h1>Dina magiska vänner 🎒</h1><p class="muted">Ju mer du lär dig, desto fler vänner och skatter dyker upp!</p></div><div class="stats-row"><div class="stat"><span class="symbol">🪙</span><strong>${p.coins}</strong><small>Stjärnmynt</small></div><div class="stat"><span class="symbol">🧸</span><strong>${CREATURES.filter(c=>l>=c.need).length}/${CREATURES.length}</strong><small>Skatter</small></div><div class="stat"><span class="symbol">🏅</span><strong>${p.achievements.length}/${ACHIEVEMENTS.length}</strong><small>Medaljer</small></div></div><h2>Magiska samlingen</h2><div class="collection-grid">${CREATURES.map(c=>`<div class="collectible ${l<c.need?'unknown':''}"><span class="item-art">${l>=c.need?c.emoji:'❔'}</span><strong>${l>=c.need?escapeHtml(c.name):'Hemlig skatt'}</strong><small>${l>=c.need?escapeHtml(c.description):'Nivå '+c.need}</small></div>`).join('')}</div><h2 class="section-spacer">Dina medaljer</h2><div class="stack">${ACHIEVEMENTS.map(a=>`<div class="achievement ${p.achievements.includes(a.id)?'':'locked'}"><span class="medal">${p.achievements.includes(a.id)?a.emoji:'🔒'}</span><div><strong>${escapeHtml(a.name)}</strong><small>${escapeHtml(a.text)}</small></div><span>${p.achievements.includes(a.id)?'✅':''}</span></div>`).join('')}</div>`}
function progress(p){const l=level(p);const entries=Object.values(p.facts||{});const attempts=entries.reduce((a,f)=>a+(f.attempts||0),0);const accuracy=p.totalAnswered?Math.round(p.totalCorrect/p.totalAnswered*100):0;const avg=p.totalCorrect?((p.totalMs/p.totalCorrect)/1000).toFixed(1):'–';return `<div class="page-head"><p class="eyebrow">MINA FRAMSTEG</p><h1>Vilken mattehjälte! 📈</h1><p class="muted">Här ser du vilka tal du redan kan snabbt och vilka som behöver lite mer övning.</p></div><div class="stats-row"><div class="stat"><span class="symbol">🌟</span><strong>${l}</strong><small>Nivå</small></div><div class="stat"><span class="symbol">🎯</span><strong>${accuracy}%</strong><small>Rätt svar</small></div><div class="stat"><span class="symbol">⏱️</span><strong>${avg}${avg==='–'?'':' s'}</strong><small>Medeltid rätt</small></div></div><div class="card"><h3>Vad betyder bemästrat?</h3><p class="muted small" style="margin-bottom:0">Ett tal räknas som bemästrat när du har svarat rätt flera gånger och senast på högst 4 sekunder. Att svara rätt är viktigare än att chansa fort!</p></div><h2>Tabellkartan</h2><div class="card">${Array.from({length:maxTable(p)},(_,i)=>i+1).map(t=>{const keys=new Set(Array.from({length:10},(_,j)=>factKey(t,j+1)));const mastered=[...keys].filter(k=>p.facts?.[k]?.mastery>=4&&p.facts[k].lastMs<=4000).length;return `<div class="bar-line"><span>${t}:an</span><div class="progress-track"><div class="progress-fill" style="width:${mastered*10}%"></div></div><span>${mastered}/10</span></div>`}).join('')}</div><div class="card"><h3>Din mattehistoria</h3><p class="muted small">${p.sessions} spelomgångar · ${(p.daysPlayed||[]).length} träningsdagar · ${attempts} besvarade unika talregistreringar · ${p.bossWins} bossar besegrade</p><p class="muted small">Bästa Blixtjakten: <strong>${p.sprintBest} rätt på 45 sekunder</strong></p><div class="inline-buttons"><button class="btn btn-soft" id="export-profile">⬇️ Spara backup</button><button class="btn btn-outline" id="open-profile-manager">⚙️ Profiler</button></div></div>`}
function bindPage(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));document.getElementById('start-practice')?.addEventListener('click',()=>startGame('practice'));document.getElementById('choose-table')?.addEventListener('click',openTablePicker);document.getElementById('claim-gift')?.addEventListener('click',claimGift);document.getElementById('export-profile')?.addEventListener('click',exportData);document.getElementById('open-profile-manager')?.addEventListener('click',()=>showProfiles())}
function claimGift(){const p=active();if(!p||p.lastGift===today())return;p.lastGift=today();p.coins+=20;save();render();toast('🎁 +20 stjärnmynt! Kom tillbaka en annan dag!');ding(true)}
function checkAchievements(p){const newOnes=[];for(const a of ACHIEVEMENTS){if(!p.achievements.includes(a.id)&&a.test(p)){p.achievements.push(a.id);p.coins+=15;newOnes.push(a)}}return newOnes}
function allQuestions(p,table=0){const max=table||maxTable(p);const arr=[];for(let a=1;a<=max;a++){for(let b=1;b<=10;b++){if(table&&a!==table&&b!==table)continue; if(table&&a!==table&&b===table)continue;arr.push({a,b,key:factKey(a,b)})}}return arr}
function nextQuestion(){const p=active();const table=game.table||0;const qs=allQuestions(p,table);const now=Date.now();let pool=qs.filter(q=>q.key!==game.previousKey);if(!pool.length)pool=qs;const weights=pool.map(q=>{const f=p.facts[q.key];if(!f)return 7;const mastery=Math.max(0,f.mastery||0);const delay=Math.max(0,now-(f.lastSeen||0));const due=delay>24*3600000?2.5:delay>3600000?1.5:1;let weight=(1+Math.max(0,5-mastery)*1.45)*(f.lastCorrect===false?1.9:1)*due; if(game.recentKeys.includes(q.key))weight*=.15;return weight});const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total,ix=0;for(;ix<weights.length-1;ix++){r-=weights[ix];if(r<=0)break}let q=pool[ix];game.previousKey=q.key;game.recentKeys.push(q.key);if(game.recentKeys.length>4)game.recentKeys.shift();return q}
function startGame(mode,table=0){const p=active();if(!p){showProfiles(true);return}if(mode==='table'&&(table<1||table>maxTable(p)))return;clearTimeout(advanceTimer);clearInterval(ticker);game={mode,table,question:null,startedAt:0,deadline:mode==='sprint'?Date.now()+45000:null,limit:mode==='sprint'?Infinity:mode==='boss'?12:10,answered:0,correct:0,wrong:0,coins:0,xp:0,combo:0,maxCombo:0,elapsedTotal:0,input:'',locked:false,previousKey:'',recentKeys:[],fastest:Infinity,newAchievements:[],startLevel:level(p),isFinished:false};game.question=nextQuestion();game.startedAt=Date.now();page='game';showGame();if(mode==='sprint'){ticker=setInterval(()=>{if(!game||game.mode!=='sprint')return;const left=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));const el=document.getElementById('time-left');if(el)el.textContent=left+' s';if(left===0)finishGame()},100)}}
function showGame(){headers();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));const modeTitle={practice:'LUGN TRÄNING',sprint:'BLIXTJAKTEN',boss:'DRAKKAMP',table:`TABELL ${game.table}`};document.getElementById('main').innerHTML=`<section class="game-shell"><div class="game-header"><button class="icon-button" id="exit-game">✕ Avsluta</button><span class="game-tag">${modeTitle[game.mode]}</span><span class="game-counter" id="counter">${game.mode==='sprint'?'⚡ 0 rätt':'1 / '+game.limit}</span></div><div class="game-bar progress-track"><div class="progress-fill" id="game-progress" style="width:0%"></div></div><div class="game-meta"><span>🔥 <span id="game-combo">0</span> i rad</span><span>${game.mode==='sprint'?'⏱️ <span id="time-left">45 s</span>':'🌟 +<span id="game-xp">0</span> XP'}</span></div><div class="question-card" id="question-card"><span class="question-creature">${game.mode==='boss'?'🐲':game.mode==='sprint'?'⚡':'🦊'}</span><span class="question-title">Vad blir det?</span><div class="equation" id="equation"></div><div id="answer-box" class="answer-box"><span class="answer-placeholder">Skriv svaret</span></div><div class="feedback" id="feedback" aria-live="polite">Du klarar det! ✨</div></div><div class="numpad" aria-label="Sifferknappar">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(v=>`<button data-digit="${v}" class="${v==='✓'?'go':v==='⌫'?'action':''}" aria-label="${v==='⌫'?'Radera':v==='✓'?'Svara':v}">${v}</button>`).join('')}</div><p class="cheer">${game.mode==='practice'?'Ta den tid du behöver. Rätt svar först!':game.mode==='sprint'?'Snabba rätta svar ger extra poäng!':game.mode==='boss'?'10 av 12 rätt för att besegra draken!':'Träna tills du kan tabellen utantill!'}</p></section>`;document.getElementById('exit-game').onclick=confirmExit;document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>handleDigit(b.dataset.digit)));updateQuestion()}
function updateQuestion(){if(!game||game.isFinished)return;document.getElementById('equation').textContent=game.question.a+' × '+game.question.b+' = ?';document.getElementById('answer-box').innerHTML='<span class="answer-placeholder">Skriv svaret</span>';document.getElementById('answer-box').className='answer-box';document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='Du klarar det! ✨';document.getElementById('counter').textContent=game.mode==='sprint'?'⚡ '+game.correct+' rätt':Math.min(game.answered+1,game.limit)+' / '+game.limit;document.getElementById('game-combo').textContent=game.combo;const xpe=document.getElementById('game-xp');if(xpe)xpe.textContent=game.xp;document.getElementById('game-progress').style.width=(game.mode==='sprint'?pct(45000-Math.max(0,game.deadline-Date.now()),45000):pct(game.answered,game.limit))+'%';game.startedAt=Date.now();game.input='';game.locked=false}
function handleDigit(d){if(!game||game.locked||game.isFinished)return;if(game.mode==='sprint'&&Date.now()>=game.deadline){finishGame();return}if(d==='⌫'){game.input=game.input.slice(0,-1)}else if(d==='✓'){submitAnswer();return}else if(game.input.length<3){game.input+=d}let e=document.getElementById('answer-box');e.textContent=game.input||'Skriv svaret';if(!game.input)e.innerHTML='<span class="answer-placeholder">Skriv svaret</span>'}
function submitAnswer(){if(!game||game.locked||!game.input)return;const now=Date.now();if(game.mode==='sprint'&&now>game.deadline){finishGame();return}game.locked=true;let ms=now-game.startedAt;const q=game.question;const correct=Number(game.input)===q.a*q.b;const p=active();let f=p.facts[q.key]||{attempts:0,correct:0,mastery:0,lastMs:0,lastSeen:0,lastCorrect:null};f.attempts++;f.lastSeen=now;f.lastCorrect=correct;
let reward=0;let points=0;
if(correct){f.correct++;f.lastMs=ms;f.mastery=Math.min(8,(f.mastery||0)+(ms<=4000?1.5:ms<=7000?1:.5));game.correct++;game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);p.combo++;p.bestCombo=Math.max(p.bestCombo,p.combo);p.totalCorrect++;p.totalMs+=ms;p.fastestMs=p.fastestMs?Math.min(p.fastestMs,ms):ms;game.fastest=Math.min(game.fastest,ms);let quick=ms<1800?14:ms<3000?10:ms<5000?6:ms<8000?3:0;points=10+quick+Math.min(10,Math.floor(game.combo/3)*2);reward=2+(quick>=10?2:quick>=6?1:0);game.xp+=points;game.coins+=reward;const el=document.getElementById('feedback');el.textContent=quick>=10?'⚡ Blixtsnabbt! +'+points+' XP':quick>=6?'🌟 Suveränt! +'+points+' XP':'✅ Rätt svar! +'+points+' XP';el.className='feedback good';ding(true)
}else{f.mastery=Math.max(0,(f.mastery||0)-1);game.wrong++;game.combo=0;p.combo=0;const el=document.getElementById('feedback');el.textContent='🌱 Rätt svar: '+(q.a*q.b)+' – du lär dig!';el.className='feedback bad';ding(false)}
p.facts[q.key]=f;p.totalAnswered++;game.answered++;game.elapsedTotal+=ms;const box=document.getElementById('answer-box');box.className='answer-box '+(correct?'correct':'wrong');box.textContent=game.input+(correct?' ✓':' ✕');if(correct)box.classList.add('sparkle');const bar=document.getElementById('game-progress');bar.style.width=(game.mode==='sprint'?pct(45000-Math.max(0,game.deadline-Date.now()),45000):pct(game.answered,game.limit))+'%';save();clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(!game)return;if(game.mode==='sprint'&&Date.now()>=game.deadline||game.answered>=game.limit)finishGame();else{game.question=nextQuestion();updateQuestion()}},correct?650:1250)}
function finishGame(){if(!game||game.isFinished)return;game.isFinished=true;clearInterval(ticker);clearTimeout(advanceTimer);const p=active();const g=game;p.xp+=g.xp;p.coins+=g.coins;p.sessions++;const d=today();if(!p.daysPlayed.includes(d))p.daysPlayed.push(d);p.lastPlayed=d;let win=g.mode==='boss'&&g.correct>=10;if(win){p.bossWins++;p.xp+=80;p.coins+=35}if(g.mode==='sprint')p.sprintBest=Math.max(p.sprintBest,g.correct);const newOnes=checkAchievements(p);const newLevel=level(p);const levelGain=newLevel-g.startLevel;if(levelGain>0)p.coins+=levelGain*20;save();game=null;page='result';headers();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));const successRate=g.answered?Math.round(g.correct/g.answered*100):0;document.getElementById('main').innerHTML=`<section class="game-shell"><div class="results-top"><span class="results-art">${g.mode==='boss'?(win?'🏆':'🐲'):successRate>=90?'🏆':successRate>=60?'🌟':'🦊'}</span><p class="eyebrow">UPPDRAG SLUTFÖRT</p><h1>${g.mode==='boss'?(win?'Draken är besegrad!':'Du utmanade draken!'):g.correct===0?'Bra att du tränar!':successRate>=90?'Fantastiskt jobbat!':'Du blir starkare!'}</h1><p>${g.mode==='sprint'?'Tiden är slut! Du kämpade riktigt bra.':g.mode==='boss'&&!win?'Öva några tal och utmana draken igen!':'Varje gång du övar blir din hjärna snabbare.'}</p></div><div class="result-stats"><div class="result-box"><strong>${g.correct}/${g.answered}</strong><small>Rätt svar</small></div><div class="result-box"><strong>+${g.xp+(win?80:0)}</strong><small>XP intjänade</small></div><div class="result-box"><strong>+${g.coins+(win?35:0)+levelGain*20+newOnes.length*15}</strong><small>Stjärnmynt</small></div></div><div class="reward-list">${g.maxCombo>=3?`<div class="reward-item">🔥 Bästa svit: ${g.maxCombo} rätt</div>`:''}${g.fastest<Infinity?`<div class="reward-item">⚡ Snabbast: ${(g.fastest/1000).toFixed(1)} s</div>`:''}${levelGain>0?`<div class="reward-item">🎉 Ny nivå: ${newLevel}!</div>`:''}${win?`<div class="reward-item">🐲 Bossbonus: +80 XP</div>`:''}${newOnes.map(a=>`<div class="reward-item">${a.emoji} Ny medalj: ${escapeHtml(a.name)}!</div>`).join('')}</div><div class="stack"><button class="btn btn-purple" id="play-again">🔁 Spela igen</button><button class="btn btn-outline" id="back-home">🏰 Till startsidan</button></div><p class="cheer">💜 Kom ihåg: en kort paus hjälper hjärnan att lära sig!</p></section>`;document.getElementById('play-again').onclick=()=>startGame(g.mode,g.table);document.getElementById('back-home').onclick=()=>{page='home';render()};if(levelGain>0||newOnes.length)ding(true)}
function confirmExit(){if(!game)return;showModal(`<div class="modal-heading"><h2>Avsluta uppdraget?</h2><button class="close-modal" data-close>×</button></div><p class="muted">Du får behålla den träning du redan gjort, men omgångens XP och mynt delas ut när du avslutar.</p><div class="inline-buttons"><button class="btn btn-outline" data-close>Fortsätt spela</button><button class="btn btn-purple" id="end-now">Avsluta omgången</button></div>`);document.getElementById('end-now').onclick=()=>{closeModal();finishGame()}}
function openTablePicker(){const p=active();choiceTable=0;showModal(`<div class="modal-heading"><h2>Vilken tabell tränar vi? 🔢</h2><button class="close-modal" data-close>×</button></div><p class="muted small">Välj en tabell. 11 och 12 låser du upp genom att spela.</p><div class="table-grid" id="table-picker">${Array.from({length:12},(_,i)=>{let n=i+1;const locked=n>maxTable(p);return `<button class="table-tile ${locked?'locked':''}" data-table="${n}" ${locked?'disabled':''}><span class="tile-emoji">${locked?'🔒':'⭐'}</span><strong>${n}:an</strong><small>${locked?'Nivå '+(n===11?5:8):'Spela'}</small></button>`}).join('')}</div>`);document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.table);closeModal();startGame('table',n)})}
function showModal(html){const layer=document.getElementById('modal-layer');layer.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';layer.classList.remove('hidden');layer.querySelectorAll('[data-close]').forEach(el=>el.onclick=closeModal);layer.onclick=e=>{if(e.target===layer)closeModal()};layer.querySelector('button')?.focus()}
function closeModal(){document.getElementById('modal-layer').classList.add('hidden');document.getElementById('modal-layer').innerHTML=''}
function showProfiles(creating=false){const list=state.profiles.map(p=>`<div class="profile-row"><span class="pic">${escapeHtml(p.avatar)}</span><div><strong>${escapeHtml(p.name)}</strong><small>Nivå ${level(p)} • ${p.totalCorrect} rätta svar</small></div><button data-switch="${p.id}">${state.active===p.id?'✓ Aktiv':'Välj'}</button></div>`).join('');showModal(`<div class="modal-heading"><h2>${creating?'Skapa din hjälte!':'Välj spelare 👋'}</h2><button class="close-modal" data-close>×</button></div>${!creating?list:''}<button class="btn btn-purple" id="new-profile">➕ Ny barnprofil</button>${!creating?`<div class="section-spacer"><h3>Backup och inställningar</h3><div class="inline-buttons"><button class="btn btn-soft" id="export-all">⬇️ Exportera</button><button class="btn btn-soft" id="import-all">⬆️ Importera</button><button class="btn btn-soft" id="mute-toggle">${mute?'🔇 Ljud av':'🔊 Ljud på'}</button></div><p class="notice section-spacer">Allt lagras bara på den här enheten och i den här webbläsaren. Vid rensning av webbplatsdata kan framsteg försvinna. Exportera gärna en backup ibland.</p><button class="danger-btn" id="delete-profile">Ta bort aktiv profil</button></div>`:''}`);document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{state.active=b.dataset.switch;save();closeModal();game=null;page='home';render()});document.getElementById('new-profile').onclick=showCreateProfile;document.getElementById('export-all')?.addEventListener('click',exportData);document.getElementById('import-all')?.addEventListener('click',importData);document.getElementById('mute-toggle')?.addEventListener('click',()=>{mute=!mute;showProfiles();toast(mute?'Ljud av':'Ljud på')});document.getElementById('delete-profile')?.addEventListener('click',deleteProfile)}
function showCreateProfile(){let selected='🦊';showModal(`<div class="modal-heading"><h2>Vad heter din hjälte? ✨</h2><button class="close-modal" data-close>×</button></div><label for="hero-name"><strong>Smeknamn</strong></label><input id="hero-name" class="name-input" placeholder="Skriv ett namn" maxlength="18" autocomplete="off" aria-label="Barnets smeknamn"><h3>Välj en magisk vän</h3><div class="avatar-choices">${EMOJIS.map((e,i)=>`<button class="avatar-choice ${i===0?'selected':''}" data-emoji="${e}" aria-label="Välj ${e}">${e}</button>`).join('')}</div><button class="btn btn-purple" id="create-profile" style="width:100%">🌟 Börja äventyret!</button><p class="muted small" style="margin-top:15px">Använd helst ett smeknamn, inte barnets fullständiga namn.</p>`);document.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{selected=b.dataset.emoji;document.querySelectorAll('[data-emoji]').forEach(x=>x.classList.toggle('selected',x===b))});const create=()=>{const name=document.getElementById('hero-name').value.trim().slice(0,18);if(!name){toast('Skriv ett smeknamn först!');return}let p=newProfile(name,selected);state.profiles.push(p);state.active=p.id;save();closeModal();page='home';game=null;render();toast('Välkommen, '+name+'! 🌟')};document.getElementById('create-profile').onclick=create;document.getElementById('hero-name').onkeydown=e=>{if(e.key==='Enter')create()};document.getElementById('hero-name').focus()}
function deleteProfile(){const p=active();if(!p)return;showModal(`<div class="modal-heading"><h2>Ta bort ${escapeHtml(p.name)}?</h2><button class="close-modal" data-close>×</button></div><p class="muted">Alla framsteg för den här profilen försvinner från denna enhet. Det går inte att ångra utan en tidigare backup.</p><div class="inline-buttons"><button class="btn btn-outline" data-close>Avbryt</button><button class="danger-btn" id="really-delete">Ja, ta bort</button></div>`);document.getElementById('really-delete').onclick=()=>{state.profiles=state.profiles.filter(x=>x.id!==p.id);state.active=state.profiles[0]?.id||null;save();closeModal();page='home';render();toast('Profil borttagen')}}
function exportData(){const body=JSON.stringify({type:'mattemastaren',version:1,exportedAt:new Date().toISOString(),profiles:state.profiles,active:state.active},null,2);const blob=new Blob([body],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mattemastaren-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup skapad!')}
function importData(){showModal(`<div class="modal-heading"><h2>Återställ backup</h2><button class="close-modal" data-close>×</button></div><p class="muted small">Importen lägger till profilerna från backupen. Dina befintliga profiler raderas inte.</p><input id="backup-input" type="file" accept="application/json,.json" class="name-input">`);document.getElementById('backup-input').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.type!=='mattemastaren'||!Array.isArray(data.profiles)||data.profiles.length>100)throw Error();let added=0;for(let raw of data.profiles){if(!raw||typeof raw.name!=='string'||typeof raw.xp!=='number'||raw.xp<0||raw.xp>1e9||!EMOJIS.includes(raw.avatar)||!raw.facts||typeof raw.facts!=='object'||Array.isArray(raw.facts))continue;let p={...newProfile(raw.name.slice(0,18),raw.avatar),...raw,id:uid(),name:raw.name.slice(0,18),avatar:raw.avatar};p.achievements=Array.isArray(raw.achievements)?raw.achievements.filter(x=>typeof x==='string').slice(0,100):[];p.daysPlayed=Array.isArray(raw.daysPlayed)?raw.daysPlayed.filter(x=>typeof x==='string').slice(-1000):[];state.profiles.push(p);added++}if(!added)throw Error();state.active=state.profiles[state.profiles.length-1].id;save();closeModal();page='home';render();toast('✅ '+added+' profiler importerades')}catch(err){toast('Kunde inte läsa backupfilen')}}}
window.addEventListener('keydown',e=>{if(document.getElementById('modal-layer').classList.contains('hidden')&&game&&!game.locked){if(/^[0-9]$/.test(e.key))handleDigit(e.key);else if(e.key==='Backspace')handleDigit('⌫');else if(e.key==='Enter')submitAnswer()}});
document.getElementById('go-home').onclick=()=>setPage('home');document.getElementById('profile-button').onclick=()=>{if(game){toast('Avsluta omgången innan du byter spelare.');return}showProfiles()};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav));window.addEventListener('visibilitychange',()=>{if(!document.hidden&&game?.mode==='sprint'&&Date.now()>=game.deadline)finishGame()});window.addEventListener('beforeunload',()=>clearInterval(ticker));
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();

  </script>
</body>
